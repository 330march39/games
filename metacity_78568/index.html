    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Nunito:wght@400;700;900&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'M PLUS Rounded 1c', 'Nunito', sans-serif; touch-action: none; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        
        .pointer-events-auto { pointer-events: auto; }
        
        /* Modern Compact Header */
        .header-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Modern Dock */
        .dock-container {
            display: flex; gap: 0.25rem; overflow-x: auto; padding: 0.4rem; scroll-behavior: smooth;
            -ms-overflow-style: none; scrollbar-width: none;
            background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dock-container::-webkit-scrollbar { display: none; }
        
        .tool-btn {
            flex: 0 0 auto; width: 56px; height: 64px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 0.5rem; transition: all 0.2s;
            background: rgba(255, 255, 255, 0.05); border: 1px solid transparent;
            position: relative;
        }
        @media (min-width: 768px) {
            .tool-btn { width: 64px; height: 72px; }
        }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .tool-btn.active {
            background: rgba(56, 189, 248, 0.25); border-color: rgba(56, 189, 248, 0.5);
            transform: translateY(-3px); box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
        }
        .tool-btn i { font-size: 1.1rem; margin-bottom: 2px; transition: transform 0.2s; }
        @media (min-width: 768px) { .tool-btn i { font-size: 1.3rem; } }
        .tool-btn.active i { transform: scale(1.1); color: #fff !important; text-shadow: 0 0 8px rgba(255,255,255,0.6); }
        
        /* Power Bar */
        .power-bar-fill { transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.5s ease; }
        @keyframes pulseAlert { 0%, 100% { background-color: rgba(239, 68, 68, 0.2); } 50% { background-color: rgba(239, 68, 68, 0.6); } }
        .blackout-alert { animation: pulseAlert 1.5s infinite; border-color: #EF4444; }
    </style>
</head>

    <script>
        // --- リアルマテリアル生成 (PBR対応) ---
        class MaterialFactory {
            constructor() {
                this.cache = {};
                this.emissiveMaterials = [];
                this.streetLights = []; 
                this.houseWindowMaterial = this.createWindowMaterial('house');
                this.buildingWindowMaterial = this.createWindowMaterial('building');
                this.darkWindowMaterial = this.createWindowMaterial('dark'); 
            }

            createWindowMaterial(type) {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                if (type === 'dark') {
                    ctx.fillStyle = '#111'; ctx.fillRect(0,0,256,256);
                    ctx.fillStyle = '#222';
                    for(let y=10; y<256; y+=30) for(let x=10; x<256; x+=30) ctx.fillRect(x, y, 20, 20);
                } else if (type === 'house') {
                    ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0,0,256,256);
                    for(let y=40; y<256; y+=100) {
                        for(let x=40; x<256; x+=80) {
                            if(Math.random() < 0.6) {
                                ctx.fillStyle = '#FFF9C4'; 
                                ctx.fillRect(x, y, 40, 50);
                                ctx.fillStyle = '#222';
                                ctx.fillRect(x+18, y, 4, 50); ctx.fillRect(x, y+23, 40, 4);
                            } else {
                                ctx.fillStyle = '#111'; ctx.fillRect(x, y, 40, 50);
                            }
                        }
                    }
                } else {
                    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0,0,256,256);
                    for(let y=10; y<256; y+=25) {
                        for(let x=10; x<256; x+=20) {
                            if(Math.random() < 0.3) ctx.fillStyle = '#444'; 
                            else if(Math.random() < 0.1) ctx.fillStyle = '#64B5F6'; 
                            else ctx.fillStyle = '#FFF59D'; 
                            ctx.fillRect(x, y, 12, 16);
                        }
                    }
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
                
                const isEmissive = type !== 'dark';
                const mat = new THREE.MeshStandardMaterial({ 
                    map: tex, roughness: 0.2, metalness: 0.6,
                    emissive: isEmissive ? 0xFFF59D : 0x000000,
                    emissiveIntensity: isEmissive ? 0.8 : 0,
                    emissiveMap: tex
                });
                if(isEmissive) this.emissiveMaterials.push(mat);
                return mat;
            }

            createStreetLightMaterial() {
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xFFB300, emissive: 0xFFB300, emissiveIntensity: 0.8
                });
                this.streetLights.push(mat);
                return mat;
            }

            updateLighting(isNight, isBlackout) {
                const intensity = (isNight && !isBlackout) ? 1.0 : 0.0;
                this.emissiveMaterials.forEach(mat => mat.emissiveIntensity = intensity * 0.8);
                this.streetLights.forEach(mat => mat.emissiveIntensity = intensity * 1.5);
            }
        }

        class TileTextureGenerator {
            constructor() {
                this.cache = { road: {}, track: {} };
                this.generateAll();
            }
            generateAll() {
                for (let i = 0; i < 16; i++) {
                    this.cache.road[i] = this.createTexture('road', i);
                    this.cache.track[i] = this.createTexture('track', i);
                }
            }
            createTexture(type, mask) {
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                const n = (mask&1)!==0, e = (mask&2)!==0, s = (mask&4)!==0, w = (mask&8)!==0;
                const c = 128, pi = Math.PI;

                ctx.fillStyle = type === 'road' ? '#3a3a3a' : '#5D4037';
                ctx.fillRect(0,0,256,256);

                if (type === 'road') {
                    const rw = 120;
                    ctx.strokeStyle = '#4a4a4a'; ctx.lineWidth = rw;
                    ctx.lineCap = 'square'; ctx.lineJoin = 'round';
                    
                    ctx.beginPath();
                    if (mask===3) { ctx.arc(256, 0, 128, pi, pi/2, true); ctx.stroke(); }
                    else if (mask===6) { ctx.arc(256, 256, 128, pi*1.5, pi, true); ctx.stroke(); }
                    else if (mask===12) { ctx.arc(0, 256, 128, 0, pi*1.5, true); ctx.stroke(); }
                    else if (mask===9) { ctx.arc(0, 0, 128, pi/2, 0, true); ctx.stroke(); }
                    else {
                        if(n){ctx.moveTo(c,c); ctx.lineTo(c,0);} if(s){ctx.moveTo(c,c); ctx.lineTo(c,256);}
                        if(e){ctx.moveTo(c,c); ctx.lineTo(256,c);} if(w){ctx.moveTo(c,c); ctx.lineTo(0,c);}
                        if(mask===0) ctx.fillRect(c-rw/2, c-rw/2, rw, rw);
                        ctx.stroke();
                        if(mask>0) ctx.fillRect(c-rw/2, c-rw/2, rw, rw);
                    }
                    // 白線（2車線の中央線）
                    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4; ctx.setLineDash([20, 20]);
                    ctx.beginPath();
                    if (mask===3) { ctx.arc(256, 0, 128, pi, pi/2, true); ctx.stroke(); }
                    else if (mask===6) { ctx.arc(256, 256, 128, pi*1.5, pi, true); ctx.stroke(); }
                    else if (mask===12) { ctx.arc(0, 256, 128, 0, pi*1.5, true); ctx.stroke(); }
                    else if (mask===9) { ctx.arc(0, 0, 128, pi/2, 0, true); ctx.stroke(); }
                    else {
                        if(n){ctx.moveTo(c,c); ctx.lineTo(c,0);} if(s){ctx.moveTo(c,c); ctx.lineTo(c,256);}
                        if(e){ctx.moveTo(c,c); ctx.lineTo(256,c);} if(w){ctx.moveTo(c,c); ctx.lineTo(0,c);}
                        ctx.stroke();
                    }
                } else if (type === 'track') {
                    ctx.fillStyle='#5D4037'; ctx.fillRect(0,0,256,256);
                    ctx.strokeStyle = '#757575'; ctx.lineWidth = 140; ctx.lineCap = 'square';
                    this.drawPath(ctx, mask, c, pi, n, e, s, w);
                    ctx.strokeStyle = '#3E2723'; ctx.lineWidth = 100; ctx.setLineDash([12, 18]);
                    this.drawPath(ctx, mask, c, pi, n, e, s, w);
                    ctx.setLineDash([]); ctx.lineWidth = 8; ctx.strokeStyle = '#B0BEC5';
                    if ([3,6,9,12].includes(mask)) {
                        let cx=0, cy=0, sAngle=0, eAngle=0;
                        if(mask===3){ cx=256; cy=0; sAngle=pi; eAngle=pi/2; }
                        else if(mask===6){ cx=256; cy=256; sAngle=pi*1.5; eAngle=pi; }
                        else if(mask===12){ cx=0; cy=256; sAngle=0; eAngle=pi*1.5; }
                        else if(mask===9){ cx=0; cy=0; sAngle=pi/2; eAngle=0; }
                        ctx.beginPath(); ctx.arc(cx, cy, 128 - 25, sAngle, eAngle, true); ctx.stroke();
                        ctx.beginPath(); ctx.arc(cx, cy, 128 + 25, sAngle, eAngle, true); ctx.stroke();
                    } else {
                        ctx.beginPath();
                        if(n||s){ let sy=n?0:c, ey=s?256:c; ctx.moveTo(c-25,sy); ctx.lineTo(c-25,ey); ctx.moveTo(c+25,sy); ctx.lineTo(c+25,ey); }
                        if(e||w){ let sx=w?0:c, ex=e?256:c; ctx.moveTo(sx,c-25); ctx.lineTo(ex,c-25); ctx.moveTo(sx,c+25); ctx.lineTo(ex,c+25); }
                        ctx.stroke();
                    }
                }
                const tex = new THREE.CanvasTexture(canvas); tex.anisotropy = 4; return tex;
            }
            drawPath(ctx, mask, c, pi, n, e, s, w) {
                ctx.beginPath();
                if(mask===3) ctx.arc(256,0,128,pi,pi/2,true); else if(mask===6) ctx.arc(256,256,128,pi*1.5,pi,true);
                else if(mask===12) ctx.arc(0,256,128,0,pi*1.5,true); else if(mask===9) ctx.arc(0,0,128,pi/2,0,true);
                else {
                    if(n){ctx.moveTo(c,c); ctx.lineTo(c,0);} if(s){ctx.moveTo(c,c); ctx.lineTo(c,256);}
                    if(e){ctx.moveTo(c,c); ctx.lineTo(256,c);} if(w){ctx.moveTo(c,c); ctx.lineTo(0,c);}
                    if(mask===0) ctx.fillRect(c-ctx.lineWidth/2, c-ctx.lineWidth/2, ctx.lineWidth, ctx.lineWidth);
                }
                ctx.stroke();
            }
        }

        // --- ゲームエンジン ---
        class MetaCityGame {
            constructor() {
                this.state = { 
                    funds: 8000, population: 0, income: 0, powerGen: 0, powerReq: 0, 
                    isBlackout: false, dayLength: 5000,
                    trafficSignal: 0, // 0: N-S, 1: E-W (信号機システム)
                    signalTimer: 0
                };

                this.buildConfig = {
                    road:       { cost: 10,   pop: 0,   inc: -1,  pwr: 0,   name: "道路" },
                    track:      { cost: 20,   pop: 0,   inc: -2,  pwr: 0,   name: "線路" },
                    solar:      { cost: 300,  pop: 0,   inc: -5,  pwr: 40,  name: "太陽光発電" }, 
                    coal:       { cost: 500,  pop: -10, inc: -20, pwr: 150, name: "火力発電" },
                    nuclear:    { cost: 3000, pop: -20, inc: -100,pwr: 800, name: "原子力発電" },
                    house:      { cost: 100,  pop: 10,  inc: 10,  pwr: -2,  name: "住宅" },
                    apartment:  { cost: 400,  pop: 50,  inc: 40,  pwr: -10, name: "マンション" },
                    shop:       { cost: 300,  pop: 5,   inc: 40,  pwr: -10, name: "商店" },
                    office:     { cost: 800,  pop: 10,  inc: 100, pwr: -25, name: "オフィス" },
                    skyscraper: { cost: 2000, pop: 100, inc: 250, pwr: -60, name: "高層ビル" },
                    hospital:   { cost: 1000, pop: 80,  inc: -30, pwr: -20, name: "病院" },
                    school:     { cost: 600,  pop: 40,  inc: -15, pwr: -10, name: "学校" },
                    station:    { cost: 500,  pop: 20,  inc: 60,  pwr: -10, name: "駅" },
                    park:       { cost: 150,  pop: 5,   inc: -5,  pwr: -1,  name: "公園" },
                    bulldoze:   { cost: 10,   pop: 0,   inc: 0,   pwr: 0,   name: "撤去" }
                };

                this.currentTool = 'road';
                this.buildings = new Map(); 
                this.actors = []; 
                this.particles = []; 
                this.weatherConfig = { isDay: true, type: 'clear' };
                this.locationInfo = { lat: 35.6895, lon: 139.6917, name: 'メタ・シティ' };
                this.mapRadius = 40; 
                this.saveKey = 'metacity_save_v2';
                
                this.texGen = new TileTextureGenerator();
                this.matGen = new MaterialFactory();

                this.init3D();
                this.setupInteraction();
                
                const loaded = this.loadGame();
                if (!loaded) {
                    this.createBuilding('coal', -2, -2, false);
                    this.createBuilding('road', 0, 1, false);
                    this.createBuilding('road', 0, 0, false);
                    this.updateTileAndNeighbors(0, 1, 'road');
                    this.updateTileAndNeighbors(0, 0, 'road');
                    this.updateCityStats();
                    this.showNotification("電力に気をつけながら街を拡大しよう！", "fa-bolt", "text-yellow-400");
                } else {
                    this.showNotification("街のデータを復元しました", "fa-check-circle", "text-green-400");
                }

                this.initGameLoop();
                this.getLocationAndWeather();
                this.selectTool('road');
                
                window.addEventListener('resize', () => this.onWindowResize(), false);
            }

            // --- セーブ＆ロード機能 ---
            saveGame(manual = false) {
                const bList = [];
                this.buildings.forEach((b, key) => {
                    const [x, z] = key.split(',');
                    bList.push({x: parseInt(x), z: parseInt(z), type: b.type});
                });
                const data = { funds: this.state.funds, buildings: bList };
                localStorage.setItem(this.saveKey, JSON.stringify(data));
                if (manual) this.showNotification("セーブしました", "fa-save", "text-blue-400");
            }

            loadGame() {
                const dataStr = localStorage.getItem(this.saveKey);
                if (!dataStr) return false;
                try {
                    const data = JSON.parse(dataStr);
                    this.state.funds = data.funds;
                    const tilesToUpdate = new Set();
                    data.buildings.forEach(b => {
                        this.createBuilding(b.type, b.x, b.z, true);
                        if(b.type === 'road' || b.type === 'track') tilesToUpdate.add(`${b.x},${b.z}:${b.type}`);
                    });
                    tilesToUpdate.forEach(key => {
                        const [coords, type] = key.split(':');
                        const [x, z] = coords.split(',');
                        this.updateTileAndNeighbors(parseInt(x), parseInt(z), type);
                    });
                    this.updateCityStats();
                    return true;
                } catch(e) {
                    console.error("Save data corrupted", e);
                    return false;
                }
            }

            resetGameConfirm() {
                document.getElementById('confirm-modal').classList.remove('hidden');
                document.getElementById('confirm-modal').classList.add('flex');
            }
            closeResetConfirm() {
                document.getElementById('confirm-modal').classList.add('hidden');
                document.getElementById('confirm-modal').classList.remove('flex');
            }
            resetGame() {
                localStorage.removeItem(this.saveKey);
                location.reload();
            }

            // --- 3Dセットアップ ---
            init3D() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x87CEEB);
                this.scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
                this.camera.position.set(20, 25, 25);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.outputEncoding = THREE.sRGBEncoding;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.0;

                document.getElementById('canvas-container').appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.enablePan = true;
                this.controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
                this.controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.PAN };
                this.controls.maxPolarAngle = Math.PI / 2 - 0.02;
                this.controls.minDistance = 2; 
                this.controls.maxDistance = 100;
                this.controls.target.set(0, 0, 0);

                this.setupLighting();
                this.createEnvironment();
                this.setupWeatherParticles();

                this.actorGroup = new THREE.Group();
                this.particleGroup = new THREE.Group();
                this.scene.add(this.actorGroup);
                this.scene.add(this.particleGroup);
                
                this.clock = new THREE.Clock();
                this.animate();
            }

            setupLighting() {
                this.ambientLight = new THREE.AmbientLight(0xdbeafe, 0.5);
                this.scene.add(this.ambientLight);

                this.dirLight = new THREE.DirectionalLight(0xfff7ed, 1.2);
                this.dirLight.position.set(40, 50, 30);
                this.dirLight.castShadow = true;
                this.dirLight.shadow.mapSize.width = 2048;
                this.dirLight.shadow.mapSize.height = 2048;
                this.dirLight.shadow.camera.near = 0.5;
                this.dirLight.shadow.camera.far = 150;
                const d = 50;
                this.dirLight.shadow.camera.left = -d; this.dirLight.shadow.camera.right = d;
                this.dirLight.shadow.camera.top = d; this.dirLight.shadow.camera.bottom = -d;
                this.dirLight.shadow.bias = -0.0005;
                this.scene.add(this.dirLight);
            }

            createEnvironment() {
                this.buildGroup = new THREE.Group();
                this.scene.add(this.buildGroup);

                const groundGeo = new THREE.PlaneGeometry(300, 300);
                groundGeo.rotateX(-Math.PI / 2);
                const groundMat = new THREE.MeshStandardMaterial({ color: 0x4CAF50, roughness: 1.0, metalness: 0 }); 
                this.ground = new THREE.Mesh(groundGeo, groundMat);
                this.ground.receiveShadow = true;
                this.scene.add(this.ground);

                const planeGeo = new THREE.PlaneGeometry(this.mapRadius * 2, this.mapRadius * 2);
                planeGeo.rotateX(-Math.PI / 2);
                const planeMat = new THREE.MeshBasicMaterial({ visible: false });
                this.buildPlane = new THREE.Mesh(planeGeo, planeMat);
                this.buildPlane.position.y = 0.01;
                this.scene.add(this.buildPlane);

                this.gridHelper = new THREE.GridHelper(this.mapRadius * 2, this.mapRadius * 2, 0xffffff, 0xffffff);
                this.gridHelper.position.y = 0.02;
                this.gridHelper.material.opacity = 0.08;
                this.gridHelper.material.transparent = true;
                this.scene.add(this.gridHelper);

                this.hoverCursor = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, 1),
                    new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.5, depthWrite: false })
                );
                this.hoverCursor.rotation.x = -Math.PI / 2;
                this.hoverCursor.position.y = 0.03;
                this.hoverCursor.visible = false;
                this.scene.add(this.hoverCursor);
            }

            setupInteraction() {
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.isDragging = false;
                const container = document.getElementById('canvas-container');

                container.addEventListener('pointerdown', () => this.isDragging = false);
                
                const updateCursor = (e) => {
                    let clientX = e.clientX, clientY = e.clientY;
                    if(e.touches && e.touches.length > 0) {
                        clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
                    }
                    this.mouse.x = (clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(clientY / window.innerHeight) * 2 + 1;
                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    const intersects = this.raycaster.intersectObject(this.buildPlane);
                    
                    if (intersects.length > 0) {
                        const point = intersects[0].point;
                        const gridX = Math.round(point.x);
                        const gridZ = Math.round(point.z);
                        if (Math.abs(gridX) <= this.mapRadius && Math.abs(gridZ) <= this.mapRadius) {
                            this.hoverCursor.position.set(gridX, 0.03, gridZ);
                            this.hoverCursor.visible = true;
                        } else {
                            this.hoverCursor.visible = false;
                        }
                    } else {
                        this.hoverCursor.visible = false;
                    }
                };

                container.addEventListener('pointermove', (e) => {
                    this.isDragging = true; updateCursor(e);
                });
                
                container.addEventListener('pointerup', (e) => {
                    if (this.isDragging && (Math.abs(e.movementX) > 2 || Math.abs(e.movementY) > 2)) return;

                    let clientX = e.clientX, clientY = e.clientY;
                    if(e.changedTouches && e.changedTouches.length > 0) {
                        clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY;
                    }

                    this.mouse.x = (clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(clientY / window.innerHeight) * 2 + 1;
                    this.raycaster.setFromCamera(this.mouse, this.camera);

                    const intersects = this.raycaster.intersectObject(this.buildPlane);
                    if (intersects.length > 0) {
                        const point = intersects[0].point;
                        const gridX = Math.round(point.x);
                        const gridZ = Math.round(point.z);

                        if (Math.abs(gridX) <= this.mapRadius && Math.abs(gridZ) <= this.mapRadius) {
                            this.handleGridClick(gridX, gridZ);
                        }
                    }
                });
            }

            selectTool(toolType) {
                this.currentTool = toolType;
                document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById(`tool-${toolType}`).classList.add('active');
            }

            handleGridClick(x, z) {
                const key = `${x},${z}`;
                const existing = this.buildings.get(key);
                const conf = this.buildConfig[this.currentTool];

                if (this.currentTool === 'bulldoze') {
                    if (existing) {
                        if (this.state.funds >= conf.cost) {
                            this.state.funds -= conf.cost;
                            const type = existing.type;
                            this.removeBuilding(key);
                            this.spawnBuildDust(x, z, true);
                            this.updateCityStats();
                            if (type === 'road' || type === 'track') this.updateTileAndNeighbors(x, z, type);
                            this.saveGame();
                        } else {
                            this.showNotification("撤去費用が足りません。", "fa-ban", "text-red-400");
                        }
                    }
                } else {
                    if (!existing) {
                        if (this.state.funds >= conf.cost) {
                            this.state.funds -= conf.cost;
                            this.createBuilding(this.currentTool, x, z);
                            this.spawnBuildDust(x, z, false);
                            this.updateCityStats();
                            if (this.currentTool === 'road' || this.currentTool === 'track') {
                                this.updateTileAndNeighbors(x, z, this.currentTool);
                            }
                            this.saveGame();
                        } else {
                            this.showNotification("資金が足りません！", "fa-coins", "text-yellow-400");
                        }
                    }
                }
            }

            removeBuilding(key) {
                const b = this.buildings.get(key);
                if (b) {
                    this.buildGroup.remove(b.mesh);
                    this.buildings.delete(key);
                }
            }

            spawnBuildDust(x, z, isBulldoze) {
                const color = isBulldoze ? 0x999999 : 0xDDDDDD;
                for(let i=0; i<10; i++) {
                    const mat = new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 0.8});
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), mat);
                    mesh.position.set(x + (Math.random()-0.5)*0.8, 0.1, z + (Math.random()-0.5)*0.8);
                    mesh.rotation.set(Math.random(), Math.random(), Math.random());
                    this.particleGroup.add(mesh);
                    
                    this.particles.push({
                        mesh: mesh, life: 1.0, velY: 0.5 + Math.random() * 1.0,
                        velX: (Math.random() - 0.5) * 1.5, velZ: (Math.random() - 0.5) * 1.5,
                        isDust: true
                    });
                }
            }

            spawnSmoke(x, y, z, colorHex) {
                const mat = new THREE.MeshBasicMaterial({color: colorHex, transparent: true, opacity: 0.5});
                const mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.15), mat);
                mesh.position.set(x + (Math.random()-0.5)*0.2, y, z + (Math.random()-0.5)*0.2);
                mesh.rotation.set(Math.random(), Math.random(), Math.random());
                this.particleGroup.add(mesh);
                
                this.particles.push({
                    mesh: mesh, life: 1.0, isDust: false,
                    velY: 0.6 + Math.random() * 0.4,
                    velX: (Math.random() - 0.5) * 0.3, velZ: (Math.random() - 0.5) * 0.3
                });
            }

            updateParticles(delta) {
                for(let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.life -= delta * (p.isDust ? 1.5 : 0.4);
                    if(p.life <= 0) {
                        this.particleGroup.remove(p.mesh);
                        this.particles.splice(i, 1);
                        continue;
                    }
                    p.mesh.position.y += p.velY * delta;
                    p.mesh.position.x += p.velX * delta;
                    p.mesh.position.z += p.velZ * delta;
                    if (p.isDust) {
                        p.mesh.scale.setScalar(Math.max(0, p.life));
                    } else {
                        p.mesh.scale.setScalar(1.0 + (1.0 - Math.max(0, p.life)) * 2.0); 
                    }
                    p.mesh.material.opacity = Math.max(0, p.life) * 0.5;
                }
            }

            // --- オートタイリング ---
            getTileMask(x, z, type) {
                let mask = 0;
                const check = (dx, dz) => { const b = this.buildings.get(`${x+dx},${z+dz}`); return b && b.type === type; };
                if (check(0,-1) || (type==='track' && this.buildings.get(`${x},${z-1}`)?.type==='station')) mask |= 1;
                if (check(1,0) || (type==='track' && this.buildings.get(`${x+1},${z}`)?.type==='station')) mask |= 2;
                if (check(0,1) || (type==='track' && this.buildings.get(`${x},${z+1}`)?.type==='station')) mask |= 4;
                if (check(-1,0) || (type==='track' && this.buildings.get(`${x-1},${z}`)?.type==='station')) mask |= 8;
                return mask;
            }

            updateTileAndNeighbors(x, z, type) {
                const dirs = [[0,0], [0,-1], [1,0], [0,1], [-1,0]];
                dirs.forEach(([dx, dz]) => {
                    const nx = x + dx, nz = z + dz;
                    const b = this.buildings.get(`${nx},${nz}`);
                    if (b && b.type === type) {
                        const mask = this.getTileMask(nx, nz, type);
                        this.applyTileMesh(b, mask);
                    }
                });
            }

            applyTileMesh(buildingObj, mask) {
                while(buildingObj.mesh.children.length > 0) buildingObj.mesh.remove(buildingObj.mesh.children[0]); 
                
                const planeGeo = new THREE.PlaneGeometry(1, 1); planeGeo.rotateX(-Math.PI/2);
                const tex = this.texGen.cache[buildingObj.type][mask];
                const mat = new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.8, depthWrite: false });
                const mesh = new THREE.Mesh(planeGeo, mat); mesh.position.y = 0.025; mesh.receiveShadow = true;
                buildingObj.mesh.add(mesh); 
                buildingObj.mask = mask;

                if (buildingObj.type === 'road') {
                    this.addStreetLightsToRoad(buildingObj.mesh, mask);
                }
            }

            addStreetLightsToRoad(group, mask) {
                const n = (mask&1)!==0, e = (mask&2)!==0, s = (mask&4)!==0, w = (mask&8)!==0;
                const positions = [];
                if (n && s && !e && !w) { positions.push([-0.35, 0], [0.35, 0]); } 
                else if (e && w && !n && !s) { positions.push([0, -0.35], [0, 0.35]); } 
                else if (mask === 0) { positions.push([0.35, 0.35], [-0.35, -0.35]); } 
                
                positions.forEach(([px, pz]) => {
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.4), new THREE.MeshStandardMaterial({color: 0x555555}));
                    pole.position.set(px, 0.2, pz); pole.castShadow = true;
                    
                    const lightMat = this.matGen.createStreetLightMaterial();
                    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), lightMat);
                    bulb.position.set(0, 0.2, 0); 
                    pole.add(bulb);
                    group.add(pole);
                });
            }

            // --- 統計と UI ---
            updateCityStats() {
                let pop = 0, inc = 0, req = 0, gen = 0;
                
                this.buildings.forEach((b) => {
                    const conf = this.buildConfig[b.type];
                    if (conf) {
                        pop += conf.pop;
                        if (conf.pwr < 0) req += Math.abs(conf.pwr);
                        else if (conf.pwr > 0) {
                            if (b.type === 'solar' && !this.weatherConfig.isDay) { /* 夜は発電しない */ } 
                            else gen += conf.pwr;
                        }
                    }
                });

                this.state.population = Math.max(0, pop); this.state.powerReq = req; this.state.powerGen = gen;
                this.state.isBlackout = (req > gen);
                
                if (this.state.isBlackout) inc = 0;
                else {
                    this.buildings.forEach((b) => {
                        const conf = this.buildConfig[b.type];
                        if (conf) inc += conf.inc;
                    });
                }
                this.state.income = inc;

                this.matGen.updateLighting(!this.weatherConfig.isDay, this.state.isBlackout);
                this.updateUI();
            }

            updateUI() {
                document.getElementById('stat-funds').innerText = `$${this.state.funds}`;
                document.getElementById('stat-pop').innerText = `${this.state.population}`;
                
                const incElem = document.getElementById('stat-income');
                if (this.state.isBlackout) {
                    incElem.innerText = `停止中`; incElem.className = `text-[10px] md:text-sm font-mono font-bold text-red-500`;
                } else {
                    incElem.innerText = (this.state.income >= 0 ? '+' : '') + `$${this.state.income}`;
                    incElem.className = `text-[10px] md:text-sm font-mono font-bold ${this.state.income >= 0 ? 'text-green-400' : 'text-red-400'}`;
                }

                const pwrText = document.getElementById('power-text');
                const pwrBar = document.getElementById('power-bar');
                const pwrPanel = document.getElementById('power-panel');
                const blackoutWarning = document.getElementById('blackout-warning');

                pwrText.innerHTML = `${this.state.powerReq} <span class="text-[8px] md:text-[9px] text-gray-400">/ ${this.state.powerGen} kW</span>`;
                
                let ratio = this.state.powerGen > 0 ? (this.state.powerReq / this.state.powerGen) * 100 : (this.state.powerReq > 0 ? 100 : 0);
                pwrBar.style.width = `${Math.min(ratio, 100)}%`;

                if (this.state.isBlackout) {
                    pwrBar.className = "power-bar-fill h-full bg-red-500";
                    pwrPanel.classList.add('blackout-alert');
                    if (blackoutWarning) blackoutWarning.classList.remove('hidden');
                } else {
                    if(ratio > 80) pwrBar.className = "power-bar-fill h-full bg-orange-400";
                    else pwrBar.className = "power-bar-fill h-full bg-blue-400";
                    pwrPanel.classList.remove('blackout-alert');
                    if (blackoutWarning) blackoutWarning.classList.add('hidden');
                }
            }

            // --- 3Dオブジェクト生成 ---
            createBox(w,h,d, mat, yOffset=h/2) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
                mesh.position.y = yOffset; mesh.castShadow = true; mesh.receiveShadow = true;
                return mesh;
            }

            createBuilding(type, x, z, skipAnim = false) {
                const group = new THREE.Group();
                group.position.set(x, 0, z);
                let updateFn = null;

                const baseMat = new THREE.MeshStandardMaterial({color:0x888888});
                const hWinMat = this.matGen.houseWindowMaterial;
                const bWinMat = this.matGen.buildingWindowMaterial;

                if (type === 'road' || type === 'track') {
                    // Mesh is generated by applyTileMesh
                } else if (type === 'house') {
                    const body = this.createBox(0.65, 0.4, 0.65, new THREE.MeshStandardMaterial({ color: 0xFDFEFE }));
                    group.add(body);
                    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.35, 4), new THREE.MeshStandardMaterial({ color: [0xEF5350, 0x42A5F5, 0x66BB6A, 0x8D6E63][Math.floor(Math.random() * 4)], roughness: 0.8 }));
                    roof.position.y = 0.575; roof.rotation.y = Math.PI/4; roof.castShadow = true; group.add(roof);
                    const w = new THREE.Mesh(new THREE.PlaneGeometry(0.66, 0.41), hWinMat);
                    w.position.set(0, 0.2, 0); group.add(w);

                } else if (type === 'apartment') {
                    const h = 1.2 + Math.random() * 0.6;
                    const body = this.createBox(0.8, h, 0.8, new THREE.MeshStandardMaterial({ color: 0xE0E0E0 }));
                    group.add(body);
                    const wMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.75, h-0.1), bWinMat);
                    wMesh.position.set(0, h/2, 0.401); group.add(wMesh);
                    const wMesh2 = wMesh.clone(); wMesh2.rotation.y=Math.PI; wMesh2.position.set(0, h/2, -0.401); group.add(wMesh2);

                } else if (type === 'shop') {
                    const h = 0.8;
                    group.add(this.createBox(0.8, h, 0.8, new THREE.MeshStandardMaterial({ color: 0xFFF3E0 })));
                    const sign = this.createBox(0.7, 0.25, 0.1, new THREE.MeshStandardMaterial({ color: [0xFF5252, 0x448AFF, 0x69F0AE][Math.floor(Math.random()*3)] }), h+0.125);
                    group.add(sign);
                    const wMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.6), bWinMat);
                    wMesh.position.set(0, 0.4, 0.401); group.add(wMesh);

                } else if (type === 'office') {
                    const h = 2.0 + Math.random();
                    group.add(this.createBox(0.85, h, 0.85, new THREE.MeshStandardMaterial({ color: 0xB0BEC5, roughness:0.3 })));
                    const wMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.8, h-0.2), bWinMat);
                    wMesh.position.set(0, h/2, 0.426); group.add(wMesh);
                    const wMesh2 = wMesh.clone(); wMesh2.rotation.y=Math.PI/2; wMesh2.position.set(0.426, h/2, 0); group.add(wMesh2);

                } else if (type === 'skyscraper') {
                    const h = 3.5 + Math.random() * 2.5;
                    group.add(this.createBox(0.9, h, 0.9, new THREE.MeshStandardMaterial({ color: 0x263238, metalness: 0.9, roughness: 0.1 })));
                    const top = this.createBox(0.5, 0.6, 0.5, new THREE.MeshStandardMaterial({ color: 0x455A64 }), h+0.3);
                    group.add(top);
                    const antenna = this.createBox(0.04, 1.2, 0.04, new THREE.MeshStandardMaterial({color:0xffffff}), h+1.2);
                    group.add(antenna);
                    [[0,0.451,0],[Math.PI, -0.451,0],[Math.PI/2,0,0.451],[-Math.PI/2,0,-0.451]].forEach(([rot, px, pz]) => {
                        const w = new THREE.Mesh(new THREE.PlaneGeometry(0.8, h-0.2), bWinMat);
                        w.rotation.y = rot; w.position.set(px, h/2, pz); group.add(w);
                    });

                } else if (type === 'hospital') {
                    group.add(this.createBox(1.4, 1.2, 0.8, new THREE.MeshStandardMaterial({ color: 0xFAFAFA })));
                    const crossMat = new THREE.MeshBasicMaterial({color: 0xE53935});
                    const c1 = this.createBox(0.12, 0.4, 0.1, crossMat, 0.6); c1.position.z = 0.41; group.add(c1);
                    const c2 = this.createBox(0.4, 0.12, 0.1, crossMat, 0.6); c2.position.z = 0.41; group.add(c2);
                    const wMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.0), bWinMat);
                    wMesh.position.set(0, 0.6, 0.401); group.add(wMesh);

                } else if (type === 'school') {
                    group.add(this.createBox(1.6, 0.6, 0.8, new THREE.MeshStandardMaterial({ color: 0xFFE082 })));
                    const clock = new THREE.Mesh(new THREE.CircleGeometry(0.15, 16), new THREE.MeshBasicMaterial({color:0xffffff}));
                    clock.position.set(0, 0.7, 0.41); group.add(clock);
                    const wMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.4), bWinMat);
                    wMesh.position.set(0, 0.3, 0.401); group.add(wMesh);

                } else if (type === 'solar') {
                    const base = this.createBox(0.9, 0.1, 0.9, baseMat); group.add(base);
                    const panelMat = new THREE.MeshStandardMaterial({color:0x1565C0, roughness:0.2, metalness:0.8});
                    const panel = this.createBox(0.8, 0.05, 0.8, panelMat, 0.2);
                    panel.rotation.x = -Math.PI/6; group.add(panel);

                } else if (type === 'coal') {
                    group.add(this.createBox(1.2, 0.8, 1.0, new THREE.MeshStandardMaterial({ color: 0x4E342E })));
                    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.5), new THREE.MeshStandardMaterial({ color: 0x212121 }));
                    pipe.position.set(-0.3, 1.0, -0.2); pipe.castShadow = true; group.add(pipe);
                    
                    updateFn = (delta) => {
                        if(!this.state.isBlackout && Math.random() < 0.2) {
                            this.spawnSmoke(group.position.x - 0.3, 1.8, group.position.z - 0.2, 0x444444);
                        }
                    };

                } else if (type === 'nuclear') {
                    group.add(this.createBox(1.5, 0.5, 1.5, new THREE.MeshStandardMaterial({ color: 0x90A4AE })));
                    const towerGeo = new THREE.CylinderGeometry(0.35, 0.5, 1.5, 16);
                    const towerMat = new THREE.MeshStandardMaterial({color: 0xCFD8DC});
                    const t1 = new THREE.Mesh(towerGeo, towerMat); t1.position.set(-0.3, 1.0, -0.3); t1.castShadow=true; group.add(t1);
                    const t2 = new THREE.Mesh(towerGeo, towerMat); t2.position.set(0.4, 1.0, 0.2); t2.castShadow=true; group.add(t2);
                    
                    updateFn = (delta) => {
                        if(!this.state.isBlackout && Math.random() < 0.3) {
                            this.spawnSmoke(group.position.x - 0.3, 1.8, group.position.z - 0.3, 0xffffff);
                            this.spawnSmoke(group.position.x + 0.4, 1.8, group.position.z + 0.2, 0xffffff);
                        }
                    };

                } else if (type === 'station') {
                    const plat = this.createBox(1, 0.15, 0.8, new THREE.MeshStandardMaterial({color: 0xBDBDBD}), 0.075); group.add(plat);
                    const roof = this.createBox(0.9, 0.05, 0.7, new THREE.MeshStandardMaterial({color: 0x0277BD}), 0.6); group.add(roof);
                    [[-0.3,-0.2],[0.3,-0.2],[-0.3,0.2],[0.3,0.2]].forEach(([px,pz]) => {
                        const p = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.5), new THREE.MeshStandardMaterial({color: 0xFFFFFF}));
                        p.position.set(px, 0.35, pz); p.castShadow=true; group.add(p);
                    });
                } else if (type === 'park') {
                    const base = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshStandardMaterial({color: 0x8BC34A}));
                    base.rotation.x = -Math.PI/2; base.position.y = 0.025; base.receiveShadow = true; group.add(base);
                    const tGeo = new THREE.ConeGeometry(0.18, 0.5, 5), tMat = new THREE.MeshStandardMaterial({color: 0x2E7D32});
                    const t1 = new THREE.Mesh(tGeo, tMat); t1.position.set(-0.25, 0.25, 0.25); t1.castShadow=true; group.add(t1);
                    const t2 = new THREE.Mesh(tGeo, tMat); t2.position.set(0.2, 0.2, -0.2); t2.castShadow=true; group.add(t2);
                    const path = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.2), new THREE.MeshStandardMaterial({color:0xD7CCC8}));
                    path.rotation.x=-Math.PI/2; path.rotation.z=Math.PI/4; path.position.y=0.03; group.add(path);
                }

                if (!skipAnim) {
                    group.scale.set(0, 0, 0); 
                }
                this.buildGroup.add(group);
                this.buildings.set(`${x},${z}`, { mesh: group, type: type, mask: 0, update: updateFn });
            }

            // --- 交通システム (AI対応版・2車線左側通行) ---
            lerpAngle(a, b, t) {
                const da = (b - a) % (Math.PI * 2);
                const dist = 2 * da % (Math.PI * 2) - da;
                return a + dist * t;
            }

            isIntersection(x, z, type) {
                let count = 0;
                if (this.buildings.get(`${x+1},${z}`)?.type === type) count++;
                if (this.buildings.get(`${x-1},${z}`)?.type === type) count++;
                if (this.buildings.get(`${x},${z+1}`)?.type === type) count++;
                if (this.buildings.get(`${x},${z-1}`)?.type === type) count++;
                return count >= 3; // 3方向以上で交差点
            }

            updateActors(delta) {
                if (this.state.isBlackout) return;

                // 信号機の切り替え
                this.state.signalTimer += delta;
                if (this.state.signalTimer > 6.0) {
                    this.state.trafficSignal = 1 - this.state.trafficSignal;
                    this.state.signalTimer = 0;
                }

                for (let i = this.actors.length - 1; i >= 0; i--) {
                    const a = this.actors[i];
                    let canMove = true;
                    
                    // --- 駅での停車処理 ---
                    if (a.isWaiting) {
                        a.waitTime -= delta;
                        if (a.waitTime <= 0) a.isWaiting = false;
                        else canMove = false;
                    }

                    // --- 交差点の信号判定 ---
                    if (canMove && a.type === 'car' && this.isIntersection(a.gridX, a.gridZ, 'road')) {
                        const inDz = Math.abs(a.gridZ - a.prevZ);
                        const isNS = inDz > 0;
                        // 自分の進行方向が赤信号の場合
                        if ((isNS && this.state.trafficSignal !== 0) || (!isNS && this.state.trafficSignal !== 1)) {
                            // 交差点に入る手前で止まる
                            if (a.progress < 0.4) {
                                a.currentSpeed = Math.max(0, a.currentSpeed - delta * 8);
                                if (a.currentSpeed < 0.1) canMove = false;
                            }
                        }
                    }

                    // --- 衝突回避 (前方車両チェック) ---
                    if (canMove) {
                        for (let j = 0; j < this.actors.length; j++) {
                            if (i === j) continue;
                            const other = this.actors[j];
                            if (a.type !== other.type) continue; // 異種は無視
                            
                            const dist = a.mesh.position.distanceTo(other.mesh.position);
                            if (dist < 1.0) {
                                // 自分の進行方向ベクトル
                                const myDirX = a.lastDir ? a.lastDir.x : (a.targetX - a.prevX);
                                const myDirZ = a.lastDir ? a.lastDir.z : (a.targetZ - a.prevZ);
                                
                                // 相手が自分の前にいるか
                                const dx = other.mesh.position.x - a.mesh.position.x;
                                const dz = other.mesh.position.z - a.mesh.position.z;
                                const dot = myDirX * dx + myDirZ * dz;
                                
                                // 同じ方向に進んでいるか (すれ違いの対向車を無視するため)
                                const otherDirX = other.lastDir ? other.lastDir.x : (other.targetX - other.prevX);
                                const otherDirZ = other.lastDir ? other.lastDir.z : (other.targetZ - other.prevZ);
                                const dotDir = myDirX * otherDirX + myDirZ * otherDirZ;

                                // 前方にいて、かつ同じ方向に進んでいる場合
                                if (dot > 0.2 && dotDir > 0 && dist < 0.7) {
                                    a.currentSpeed = Math.max(0, a.currentSpeed - delta * 8);
                                    canMove = false;
                                    break;
                                }
                            }
                        }
                    }

                    if (canMove) {
                        // 少しずつ加速
                        a.currentSpeed = Math.min(a.baseSpeed, a.currentSpeed + delta * 3);
                    }

                    if (a.currentSpeed > 0) {
                        a.progress += delta * a.currentSpeed;
                    }

                    // --- タイル移動の遷移 ---
                    if (a.progress >= 1.0) {
                        const overshoot = a.progress - 1.0;
                        a.gridX = a.targetX; a.gridZ = a.targetZ;
                        
                        const currentTile = this.buildings.get(`${a.gridX},${a.gridZ}`);
                        if (!currentTile || !a.allowedTypes.includes(currentTile.type)) {
                            this.actorGroup.remove(a.mesh);
                            if(a.trailMeshes) a.trailMeshes.forEach(m => this.actorGroup.remove(m));
                            this.actors.splice(i, 1);
                            continue;
                        }

                        // 駅での停車
                        if (currentTile.type === 'station' && a.type === 'train' && !a.isWaiting) {
                            a.isWaiting = true;
                            a.waitTime = 2.0; 
                            a.progress = 0.5; 
                            continue;
                        }

                        const dirs = [{x:1,z:0}, {x:-1,z:0}, {x:0,z:1}, {x:0,z:-1}];
                        const validDirs = dirs.map(d => ({x: a.gridX + d.x, z: a.gridZ + d.z}))
                                              .filter(pos => {
                                                  // 直前の場所には戻らない（行き止まり以外）
                                                  if (pos.x === a.prevX && pos.z === a.prevZ) return false;
                                                  const b = this.buildings.get(`${pos.x},${pos.z}`);
                                                  return b && a.allowedTypes.includes(b.type);
                                              });

                        let nextPos = validDirs.length > 0 ? validDirs[Math.floor(Math.random() * validDirs.length)] : {x: a.prevX, z: a.prevZ};
                        a.prevX = a.gridX; a.prevZ = a.gridZ;
                        a.targetX = nextPos.x; a.targetZ = nextPos.z;
                        a.progress = Math.min(overshoot, 0.99);
                    }

                    // --- 左側通行（車線オフセット）を考慮したベジェ曲線補間 ---
                    const offset = a.type === 'car' ? 0.16 : (a.type === 'ped' ? 0.25 : 0);

                    let inDx = a.gridX - a.prevX; let inDz = a.gridZ - a.prevZ;
                    if (inDx === 0 && inDz === 0) {
                        if (a.lastDir) { inDx = a.lastDir.x; inDz = a.lastDir.z; }
                        else { inDx = 1; inDz = 0; }
                    } else {
                        a.lastDir = {x: inDx, z: inDz};
                    }

                    let outDx = a.targetX - a.gridX; let outDz = a.targetZ - a.gridZ;
                    if (outDx === 0 && outDz === 0) { outDx = inDx; outDz = inDz; }

                    // 左側通行のオフセット計算 (進行方向ベクトルの左)
                    const inLeftX = inDz * offset; const inLeftZ = -inDx * offset;
                    const outLeftX = outDz * offset; const outLeftZ = -outDx * offset;

                    // 制御点の計算
                    const p0x = (a.prevX + a.gridX) / 2 + inLeftX;
                    const p0z = (a.prevZ + a.gridZ) / 2 + inLeftZ;
                    const p2x = (a.targetX + a.gridX) / 2 + outLeftX;
                    const p2z = (a.targetZ + a.gridZ) / 2 + outLeftZ;
                    const p1x = a.gridX + (inLeftX + outLeftX) / 2;
                    const p1z = a.gridZ + (inLeftZ + outLeftZ) / 2;

                    const t = a.progress;
                    const invT = 1 - t;
                    const posX = invT * invT * p0x + 2 * invT * t * p1x + t * t * p2x;
                    const posZ = invT * invT * p0z + 2 * invT * t * p1z + t * t * p2z;

                    a.mesh.position.x = posX;
                    a.mesh.position.z = posZ;

                    const dx = 2 * invT * (p1x - p0x) + 2 * t * (p2x - p1x);
                    const dz = 2 * invT * (p1z - p0z) + 2 * t * (p2z - p1z);
                    
                    if (Math.abs(dx) > 0.001 || Math.abs(dz) > 0.001) {
                        const targetAngle = Math.atan2(dx, dz);
                        a.mesh.rotation.y = this.lerpAngle(a.mesh.rotation.y, targetAngle, delta * 15);
                    }

                    // 軌跡追従 (電車など)
                    if (a.history) {
                        const dist = a.mesh.position.distanceTo(a.lastPos);
                        if (dist > 0.05) {
                            a.history.unshift({x: a.mesh.position.x, y: a.mesh.position.y, z: a.mesh.position.z, rotY: a.mesh.rotation.y});
                            if (a.history.length > 40) a.history.pop();
                            a.lastPos.copy(a.mesh.position);
                        }
                        
                        if (a.trailMeshes) {
                            const delay1 = 12, delay2 = 24;
                            if (a.history[delay1]) {
                                a.trailMeshes[0].position.set(a.history[delay1].x, a.history[delay1].y, a.history[delay1].z);
                                a.trailMeshes[0].rotation.y = a.history[delay1].rotY;
                            }
                            if (a.history[delay2]) {
                                a.trailMeshes[1].position.set(a.history[delay2].x, a.history[delay2].y, a.history[delay2].z);
                                a.trailMeshes[1].rotation.y = a.history[delay2].rotY;
                            }
                        }
                    }
                }
            }

            spawnActors() {
                if (this.state.isBlackout) return;

                let roadCount = 0, trackCount = 0, walkCount = 0;
                const roads = [], tracks = [], walkSpots = [];
                
                this.buildings.forEach((b, key) => {
                    const [x, z] = key.split(',').map(Number);
                    if (b.type === 'road') { roads.push({x,z}); roadCount++; }
                    if (b.type === 'track' || b.type === 'station') { tracks.push({x,z}); trackCount++; }
                    // 歩行者のスポーン地点（商業や公園などの近く）
                    if (['shop', 'office', 'skyscraper', 'park', 'stadium', 'school', 'hospital'].includes(b.type)) {
                        walkSpots.push({x,z});
                    }
                });

                // 生成上限の最適化（人口ベースなど）
                const maxCars = Math.min(25, Math.floor(roadCount / 3));
                const maxTrains = Math.min(5, Math.floor(trackCount / 4));
                const maxPeds = Math.min(50, Math.floor(this.state.population / 2)); // 人口に比例！

                let carCount = 0, trainCount = 0, pedCount = 0;
                this.actors.forEach(a => {
                    if(a.type === 'car') carCount++;
                    if(a.type === 'train') trainCount++;
                    if(a.type === 'ped') pedCount++;
                });

                const isTileOccupied = (x, z) => {
                    for(let a of this.actors) {
                        if (Math.abs(a.mesh.position.x - x) < 0.5 && Math.abs(a.mesh.position.z - z) < 0.5) return true;
                    }
                    return false;
                };

                if (roads.length > 0 && carCount < maxCars && Math.random() < 0.3) {
                    const start = roads[Math.floor(Math.random() * roads.length)];
                    if(!isTileOccupied(start.x, start.z)) this.createActor('car', start.x, start.z);
                }
                if (tracks.length > 0 && trainCount < maxTrains && Math.random() < 0.1) {
                    const start = tracks[Math.floor(Math.random() * tracks.length)];
                    if(!isTileOccupied(start.x, start.z)) this.createActor('train', start.x, start.z);
                }
                if (walkSpots.length > 0 && pedCount < maxPeds && Math.random() < 0.5) {
                    const spot = walkSpots[Math.floor(Math.random() * walkSpots.length)];
                    // 施設の隣の道などを探す
                    const dirs = [{x:1,z:0}, {x:-1,z:0}, {x:0,z:1}, {x:0,z:-1}];
                    for (let d of dirs) {
                        const nx = spot.x + d.x, nz = spot.z + d.z;
                        const b = this.buildings.get(`${nx},${nz}`);
                        if (b && !['track','bulldoze'].includes(b.type)) {
                            this.createActor('ped', nx, nz);
                            break;
                        }
                    }
                }
            }

            createActor(type, x, z) {
                let mesh, speed, allowedTypes, history = null, trailMeshes = null;
                const group = new THREE.Group();

                if (type === 'car') {
                    const colors = [0xF44336, 0x2196F3, 0xFFEB3B, 0xFFFFFF, 0x9C27B0, 0x4CAF50, 0x263238];
                    const bodyMat = new THREE.MeshStandardMaterial({color: colors[Math.floor(Math.random()*colors.length)], roughness: 0.3});
                    const body = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.5), bodyMat);
                    body.position.y = 0.1; body.castShadow = true; group.add(body);
                    const roof = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.1, 0.25), new THREE.MeshStandardMaterial({color:0xeeeeee}));
                    roof.position.set(0, 0.21, -0.05); roof.castShadow = true; group.add(roof);
                    const headlight = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 0.05), new THREE.MeshBasicMaterial({color:0xffffff}));
                    headlight.position.set(0.1, 0.1, 0.251); group.add(headlight);
                    const headlight2 = headlight.clone(); headlight2.position.set(-0.1, 0.1, 0.251); group.add(headlight2);
                    
                    mesh = group; speed = 1.8; allowedTypes = ['road'];

                } else if (type === 'train') {
                    const mat = new THREE.MeshStandardMaterial({color: 0x8BC34A, metalness: 0.3});
                    const winMat = this.matGen.darkWindowMaterial;
                    const createTrainCar = () => {
                        const car = new THREE.Group();
                        const body = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.4, 0.7), mat);
                        body.position.y = 0.3; body.castShadow = true; car.add(body);
                        const w1 = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.15), winMat);
                        w1.rotation.y = Math.PI/2; w1.position.set(0.18, 0.3, 0); car.add(w1);
                        const w2 = w1.clone(); w2.rotation.y = -Math.PI/2; w2.position.set(-0.18, 0.3, 0); car.add(w2);
                        return car;
                    };
                    mesh = createTrainCar();
                    trailMeshes = [createTrainCar(), createTrainCar()];
                    trailMeshes.forEach(m => { m.position.set(x, 0, z); this.actorGroup.add(m); });
                    history = []; speed = 2.0; allowedTypes = ['track', 'station'];
                    
                } else if (type === 'ped') {
                    mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.2, 8), new THREE.MeshStandardMaterial({color: Math.random() * 0xffffff}));
                    mesh.position.set(0, 0.1, 0);
                    group.add(mesh);
                    mesh = group; speed = 0.8;
                    allowedTypes = Object.keys(this.buildConfig).filter(t => !['track','bulldoze'].includes(t));
                }

                mesh.position.set(x, 0, z); this.actorGroup.add(mesh);

                const dirs = [{x:1,z:0}, {x:-1,z:0}, {x:0,z:1}, {x:0,z:-1}];
                const validDirs = dirs.map(d => ({x: x + d.x, z: z + d.z}))
                                      .filter(pos => {
                                          const b = this.buildings.get(`${pos.x},${pos.z}`);
                                          return b && allowedTypes.includes(b.type);
                                      });
                let nextPos = validDirs.length > 0 ? validDirs[Math.floor(Math.random() * validDirs.length)] : {x, z};

                this.actors.push({
                    mesh: mesh, type: type, 
                    baseSpeed: speed, currentSpeed: speed,
                    allowedTypes: allowedTypes,
                    gridX: x, gridZ: z, targetX: nextPos.x, targetZ: nextPos.z,
                    prevX: x, prevZ: z, progress: 0.5,
                    isWaiting: false, waitTime: 0,
                    history: history, trailMeshes: trailMeshes, lastPos: new THREE.Vector3(x,0,z)
                });
            }

            // --- ゲームループ・環境 ---
            initGameLoop() {
                setInterval(() => {
                    if (this.state.income !== 0) {
                        this.state.funds += this.state.income;
                        this.updateUI();
                        
                        const incomeElem = document.getElementById('stat-funds');
                        const colorClass = this.state.income > 0 ? 'text-green-400' : 'text-red-400';
                        incomeElem.classList.add(colorClass);
                        incomeElem.classList.remove('text-yellow-300');
                        setTimeout(() => {
                            incomeElem.classList.remove(colorClass);
                            incomeElem.classList.add('text-yellow-300');
                        }, 500);

                        this.saveGame();
                    }
                    this.spawnActors();
                }, this.state.dayLength);
                setInterval(() => { this.fetchWeather(); }, 600000);
            }

            showNotification(msg, icon="fa-info-circle", colorClass="text-blue-500") {
                const notif = document.getElementById('notification');
                document.getElementById('notif-text').innerText = msg;
                const i = notif.querySelector('i');
                i.className = `fas ${icon} ${colorClass} text-lg`;
                
                notif.classList.add('show');
                if(this.notifTimeout) clearTimeout(this.notifTimeout);
                this.notifTimeout = setTimeout(() => { notif.classList.remove('show'); }, 2500);
            }

            setupWeatherParticles() {
                const rainCount = 2000;
                const rainGeo = new THREE.BufferGeometry();
                const rainPos = new Float32Array(rainCount * 3);
                for(let i=0; i<rainCount; i++) {
                    rainPos[i*3] = (Math.random() - 0.5) * 80;
                    rainPos[i*3+1] = Math.random() * 30;
                    rainPos[i*3+2] = (Math.random() - 0.5) * 80;
                }
                rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
                const rainMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.1, transparent: true, opacity: 0.6 });
                this.rainSystem = new THREE.Points(rainGeo, rainMat);
                this.rainSystem.visible = false;
                this.scene.add(this.rainSystem);
            }

            getLocationAndWeather() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => { this.locationInfo.lat = pos.coords.latitude; this.locationInfo.lon = pos.coords.longitude; this.fetchWeather(); },
                        () => { this.fetchWeather(); }
                    );
                } else { this.fetchWeather(); }
            }

            async fetchWeather() {
                try {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${this.locationInfo.lat}&longitude=${this.locationInfo.lon}&current_weather=true&timezone=auto`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.current_weather) {
                        const code = data.current_weather.weathercode;
                        const wasDay = this.weatherConfig.isDay;
                        this.weatherConfig.isDay = data.current_weather.is_day === 1;
                        if(wasDay !== this.weatherConfig.isDay) this.updateCityStats();

                        if (code <= 3) this.weatherConfig.type = 'clear';
                        else if (code >= 51 && code <= 67) this.weatherConfig.type = 'rain';
                        else if (code >= 71 && code <= 77) this.weatherConfig.type = 'snow';
                        else if (code >= 80) this.weatherConfig.type = 'rain';
                        else this.weatherConfig.type = 'cloudy';
                        this.applyWeatherToScene();
                    }
                } catch (e) { this.applyWeatherToScene(); }
            }

            applyWeatherToScene() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
                
                let iconClass = 'fa-sun'; let weatherText = '晴れ';
                let skyColor = 0x87CEEB; let lightInt = 1.2; let ambientInt = 0.5;

                if (!this.weatherConfig.isDay) {
                    skyColor = 0x0f172a; 
                    lightInt = this.state.isBlackout ? 0.05 : 0.1; 
                    ambientInt = this.state.isBlackout ? 0.05 : 0.15;
                    iconClass = 'fa-moon';
                    this.dirLight.color.setHex(0xaaccFF);
                } else {
                    this.dirLight.color.setHex(0xfff7ed);
                }

                this.rainSystem.visible = false;
                if (this.weatherConfig.type === 'rain' || this.weatherConfig.type === 'snow') {
                    weatherText = this.weatherConfig.type === 'rain' ? '雨' : '雪';
                    iconClass = this.weatherConfig.type === 'rain' ? 'fa-cloud-rain' : 'fa-snowflake';
                    skyColor = this.weatherConfig.isDay ? 0x64748b : 0x0f172a;
                    lightInt *= 0.6; this.rainSystem.visible = true;
                    if(this.weatherConfig.type === 'snow') { this.rainSystem.material.color.setHex(0xffffff); this.rainSystem.material.size = 0.15; } 
                    else { this.rainSystem.material.color.setHex(0xaaccff); this.rainSystem.material.size = 0.1; }
                } else if (this.weatherConfig.type === 'cloudy') {
                    weatherText = '曇り'; iconClass = 'fa-cloud';
                    skyColor = this.weatherConfig.isDay ? 0x94a3b8 : 0x1e293b; lightInt *= 0.8;
                }

                this.scene.background = new THREE.Color(skyColor);
                this.scene.fog.color = new THREE.Color(skyColor);
                this.dirLight.intensity = lightInt;
                this.ambientLight.intensity = ambientInt;

                document.getElementById('weather-icon').innerHTML = `<i class="fas ${iconClass}"></i>`;
                document.getElementById('time-weather-info').innerText = `${timeStr} | ${weatherText}`;
                
                this.matGen.updateLighting(!this.weatherConfig.isDay, this.state.isBlackout);
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                const delta = this.clock.getDelta();

                this.buildings.forEach((b) => {
                    if (b.mesh.scale.x < 1) {
                        const s = Math.min(1, b.mesh.scale.x + delta * 4);
                        b.mesh.scale.set(s, s, s);
                    }
                    if (b.update) b.update(delta);
                });

                this.updateActors(delta);
                this.updateParticles(delta);

                if (this.rainSystem && this.rainSystem.visible) {
                    const positions = this.rainSystem.geometry.attributes.position.array;
                    const speed = this.weatherConfig.type === 'snow' ? 1.5 * delta : 12 * delta;
                    for (let i = 1; i < positions.length; i += 3) {
                        positions[i] -= speed;
                        if (positions[i] < 0) positions[i] = 30;
                    }
                    this.rainSystem.geometry.attributes.position.needsUpdate = true;
                }

                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        let game;
        window.onload = () => { game = new MetaCityGame(); };
    </script>
</body>
</html>
